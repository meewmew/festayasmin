<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Lista da Yasmin ★</title><link rel="stylesheet" href="/style.css?v=20261112quicksand"><style>body{min-height:100dvh;padding:24px;background:#10000d url('/background.png') center/cover fixed;color:#fff;font-family:var(--invite-font)}.admin{max-width:700px;margin:8vh auto;border:3px ridge #f7adcf;background:#190514;box-shadow:8px 8px #000;padding:24px}.admin h1{color:#ff8ac3;font-family:Georgia,serif;font-size:36px}.admin input{display:block;width:100%;min-height:46px;background:#fff;color:#111;border:3px inset #ccc;margin:12px 0;padding:8px;font-size:16px}.admin button{min-height:44px;padding:10px 18px;margin:8px 6px 8px 0;background:#f6a5ce;color:#190514;border:3px outset #ffd5eb;cursor:pointer;font-weight:bold}.admin button:focus-visible,.admin input:focus-visible{outline:3px solid #fff;outline-offset:3px}.admin article{padding:12px 0;border-bottom:1px dotted #a34e79}.admin ul{padding-left:22px;overflow-wrap:anywhere}.admin time{font-size:12px;color:#d0a4bd}.admin [hidden]{display:none!important}#status{min-height:24px;color:#ffb6d9}a{color:#ffb6d9}</style><script defer src="/admin.js"></script></head><body><main class="admin"><a href="/">← Voltar ao convite</a><h1>Lista da Yasmin ★</h1><form id="login"><label for="password">Senha da aniversariante</label><input id="password" type="password" autocomplete="current-password" required maxlength="200"><button>Entrar</button></form><p id="status" role="status" aria-live="polite"></p><section id="panel" hidden><h2 id="count">Convidados confirmados</h2><button id="refresh">Atualizar lista</button><button id="export">Baixar lista (.csv)</button><button id="logout">Sair</button><div id="guests"></div></section></main></body></html>
